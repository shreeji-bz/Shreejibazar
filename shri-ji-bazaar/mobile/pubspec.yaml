name: shri_ji_bazaar
description: Shri Ji Bazaar - Play, Earn, and Win
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^13.0.0
  get: ^4.6.6
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  pretty_dio_logger: ^1.3.1
  intl: ^0.19.0
  fluttertoast: ^8.2.4
  supabase_flutter: ^2.5.0
  webview_flutter: ^4.10.0
  share_plus: ^12.0.2
  app_links: ^6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/banners/
    - assets/backgrounds/
    - assets/animations/
    - assets/fonts/
