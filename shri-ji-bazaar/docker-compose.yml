version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sji-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shrijibazaar
      POSTGRES_PASSWORD: shrijibazaar123
      POSTGRES_DB: shriji_bazaar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sji-network

  redis:
    image: redis:7-alpine
    container_name: sji-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sji-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sji-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://shrijibazaar:shrijibazaar123@postgres:5432/shriji_bazaar
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-jwt-secret-key-change-in-production
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - postgres
      - redis
    networks:
      - sji-network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: sji-admin
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000/api
    volumes:
      - ./admin:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - sji-network

volumes:
  postgres_data:
  redis_data:

networks:
  sji-network:
    driver: bridge